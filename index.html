<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donatelos TV • En Vivo</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --panel-dark: rgba(15, 18, 25, 0.75);
      --card-bg: rgba(255, 255, 255, 0.03);
      --accent-orange: #f97316;
      --accent-hover: #fb923c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --glass-blur: blur(20px);
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    nav {
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-container { display: flex; align-items: center; gap: 10px; }
    .logo-text { font-weight: 800; font-size: 16px; color: #ffffff; }
    .nav-logo { height: 32px; width: auto; object-fit: contain; }

    /* Franja de anuncios */
    .announcement-bar {
      width: 100%;
      background: rgba(15, 18, 25, 0.85);
      border-bottom: 1px solid var(--border-color);
      overflow: hidden;
      padding: 10px 20px;
      white-space: nowrap;
    }

    .main-wrapper { max-width: 1400px; margin: 0 auto; padding: 24px; }
    
    .hero-banner {
      background: linear-gradient(135deg, rgba(20, 20, 30, 0.6) 0%, rgba(35, 25, 45, 0.4) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
    }

    .hero-player { width: 100%; border-radius: 16px; overflow: hidden; background: #000; }
    video { width: 100%; height: 320px; display: block; object-fit: contain; }

    .glass-panel {
      background: rgba(15, 18, 25, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 14px;
      color: white;
    }

    .grid-channels {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    /* Widget Flotante */
    .live-bubble {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 280px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      z-index: 9999;
      overflow: hidden;
    }

    .live-bubble-header {
      background: rgba(30, 41, 59, 0.8);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .live-bubble-body { padding: 12px; font-size: 0.8rem; }

    @media (max-width: 900px) {
      .hero-banner { grid-template-columns: 1fr; }
      video { height: 220px; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo-container">
      <img src="logo.png" alt="Donatelos TV" class="nav-logo" onerror="this.src='logo.jpg';">
      <span class="logo-text">DONATELOS TV</span>
    </div>
  </nav>

  <!-- Franja de Anuncios -->
  <div class="announcement-bar">
    <span id="top-bar-text" style="color: #38bdf8; font-weight: 500;">Cargando anuncios...</span>
  </div>

  <div class="main-wrapper">
    <div class="hero-banner">
      
      <!-- Columna Reproductor -->
      <div>
        <h2 id="current-channel-title">Tu señal en la pantalla</h2>
        <div class="hero-player">
          <video id="video" controls playsinline></video>
        </div>
      </div>

      <!-- Columna Lateral -->
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div class="glass-panel">
          <h4 style="margin: 0 0 10px 0; color: #f97316;">📺 Canales Disponibles</h4>
          <div id="sidebar-channels-grid" style="max-height: 280px; overflow-y: auto;"></div>
        </div>
      </div>

    </div>

    <!-- Contenedor Agenda -->
    <div id="inline-sports-container" style="margin-top: 15px;"></div>

    <!-- Grilla principal -->
    <div id="channels-grid" class="grid-channels">
      <p>Cargando lista de canales...</p>
    </div>
  </div>

  <!-- Burbuja flotante -->
  <div id="live-score-bubble" class="live-bubble">
    <div class="live-bubble-header" onclick="toggleLiveBubble()">
      <span>🔴 En Vivo / Próximos</span>
      <span id="bubble-toggle-icon">▼</span>
    </div>
    <div id="live-bubble-content" class="live-bubble-body">
      <p style="text-align: center; color: #94a3b8;">Cargando...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
