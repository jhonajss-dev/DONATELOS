name: Automatizar Scraper de Partidos

on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta automáticamente cada hora
  workflow_dispatch: # Permite lanzarlo manualmente desde la pestaña Actions de GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias (Puppeteer y Supabase)
        run: npm install puppeteer @supabase/supabase-js

      - name: Ejecutar script
        run: node scraper.js
